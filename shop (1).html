<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script src="js/theme.js"></script>
  <script type="module" src="js/badge.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <title>Products – Northwind Admin</title>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="site-header">
    <div class="brand">
      <button type="button" class="menu-toggle" aria-controls="sidebar" aria-expanded="false">
        <span class="visually-hidden">Toggle navigation menu</span>
        <span aria-hidden="true">&#9776;</span>
      </button>
      <a class="brand-link" href="index.html">Northwind Admin</a>
    </div>
    <nav class="top-nav" aria-label="Top navigation">
      <ul>
        <li><a href="settings.html">Settings</a></li>
        <li><a href="#help-footer">Help</a></li>
        <li><a class="cart-link" href="shop.html#cart">Cart (<span data-cart-count>0</span>)</a></li>
      </ul>
    </nav>
    <button type="button" class="theme-toggle" aria-pressed="false">Dark mode</button>
    <form class="search-form" role="search" action="users.html" method="get">
      <label for="site-search" class="visually-hidden">Search the dashboard</label>
      <input id="site-search" name="q" type="search" placeholder="Search users…" autocomplete="off">
      <button type="submit">Search</button>
    </form>
  </header>
  <div class="layout">
    <aside id="sidebar" class="sidebar" aria-label="Sidebar">
      <nav aria-label="Main navigation">
        <ul>
          <li><a href="index.html">Overview</a></li>
          <li><a href="shop.html" aria-current="page">Products</a></li>
          <li><a href="users.html">Users</a></li>
          <li><a href="reports.html">Reports</a></li>
          <li><a href="settings.html">Settings</a></li>
        </ul>
      </nav>
    </aside>
    <main id="main-content" tabindex="-1">
      <h1>Products</h1>
      <noscript><p class="notice-inline">JavaScript is required to load the product catalogue.</p></noscript>
      <div id="banner" class="banner" role="alert" hidden></div>

      <div class="shop-layout">
        <section class="shop-main" aria-labelledby="catalog-heading">
          <h2 id="catalog-heading">Catalogue</h2>

          <div class="toolbar">
            <div class="field">
              <label for="product-search">Search products</label>
              <input id="product-search" type="search" autocomplete="off" placeholder="Try &quot;jacket&quot; or &quot;ssd&quot;">
            </div>
            <div class="field">
              <label for="product-sort">Sort by</label>
              <select id="product-sort">
                <option value="relevance">Featured</option>
                <option value="price-asc">Price: low to high</option>
                <option value="price-desc">Price: high to low</option>
                <option value="rating-desc">Top rated</option>
                <option value="name-asc">Name: A to Z</option>
              </select>
            </div>
          </div>

          <p id="category-label" class="toolbar-label">Category</p>
          <div id="category-tabs" class="tabs" role="group" aria-labelledby="category-label">
            <button type="button" data-category="all" aria-pressed="true">All</button>
          </div>

          <p id="results-status" class="results-status" role="status">Loading products…</p>
          <div id="product-region" aria-busy="true"></div>
        </section>

        <aside id="cart" class="cart" aria-labelledby="cart-heading">
          <h2 id="cart-heading" tabindex="-1">Your cart</h2>
          <div id="cart-body"></div>
          <p id="cart-status" class="visually-hidden" role="status"></p>
        </aside>
      </div>
    </main>
  </div>
  <footer class="site-footer" id="help-footer">
    <p>&copy; 2026 Northwind Corp. Internal use only.</p>
    <nav aria-label="Footer navigation">
      <ul>
        <li><a href="settings.html">Accessibility preferences</a></li>
        <li><a href="reports.html">Audit log</a></li>
      </ul>
    </nav>
  </footer>
  <script src="js/app.js"></script>
  <script type="module" src="js/shop.js"></script>
</body>
</html>
